appId: com.example.fridgy
---
- runFlow:
    when:
      visible: "I'll Do This Later"
    commands:
      - tapOn: "I'll Do This Later"
      - tapOn: "I'll Do This Later"
      - tapOn: "I'll Do This Later"
      - tapOn: "I'll Do This Later"
      - tapOn: "Maybe Later"
      - tapOn: "Let's Explore Fridgy"
- runFlow:
    when:
      visible: "Sign in"
    commands:
      - tapOn: "Sign in"
      - tapOn: "Enter your email"
      - inputText: "alex@example.com"
      - tapOn: "Enter your password"
      - inputText: "password123"
      - pressKey: Enter
- extendedWaitUntil:
    visible: ".*Items.*"
    timeout: 30000
- takeScreenshot: loaded-top
- scrollUntilVisible:
    element: "Fridgy Suggests"
    direction: DOWN
    timeout: 40000
- takeScreenshot: loaded-bottom
